# TEMPORARY, safe to delete. Manually-dispatched harness proving
# scripts/check-changelog-date.mjs genuinely runs (and genuinely fails) under real GitHub
# Actions, without touching release.yml or ever creating a GitHub Release. Runs the exact
# same script the verify job runs, with the release tag passed as a dispatch input instead
# of coming from a release event, so both the pass and fail cases can be exercised safely.
# contents: read only, no publish rights, not part of the release path.
name: _scratch changelog gate check (temporary)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to check the changelog against, e.g. v1.0.1 or a deliberately wrong one'
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check CHANGELOG.md is dated for this release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/check-changelog-date.mjs
